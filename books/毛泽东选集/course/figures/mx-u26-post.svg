<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 760" width="100%" height="auto" role="img" aria-labelledby="svg-title svg-desc" data-quality-profile="standard">
              <title id="svg-title">《论持久战》的条件、阶段与执行结构</title>
              <desc id="svg-desc">上方从日本和中国的强弱条件推导持久战；中部是战略防御、战略相持与战略反攻三个阶段；下方说明战略持久与战役速决、主动灵活计划、政治动员和条件反馈共同推动力量对比变化。最下方列出三个阅读审计边界。</desc>
              <style>
                text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
                .title { font-size: 20px; font-weight: 750; fill: #17211d; }
                .sub { font-size: 12px; fill: #66716b; }
                .lane { font-size: 13px; font-weight: 750; fill: #4c5751; }
                .node-title { font-size: 15px; font-weight: 750; fill: #17211d; }
                .node-sub { font-size: 11px; fill: #4c5751; }
                .phase-num { font-size: 11px; font-weight: 800; letter-spacing: .08em; }
                .phase-title { font-size: 17px; font-weight: 800; fill: #17211d; }
                .phase-sub { font-size: 12px; fill: #4c5751; }
                .edge-label { font-size: 11px; font-weight: 700; }
                .audit-title { font-size: 12px; font-weight: 800; fill: #7f1d1d; }
                .audit-sub { font-size: 10.5px; fill: #4c5751; }
              </style>
              <defs>
                <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2b6f88"/></marker>
                <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#a34e23"/></marker>
                <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#7653a6"/></marker>
              </defs>
              <rect width="1360" height="760" rx="20" fill="#fffdf8"/>
              <text class="title" x="40" y="34">《论持久战》：从条件判断，到阶段转换，再到改变条件</text>
              <text class="sub" x="40" y="57">报告结构化复原 · 箭头表示论证与行动关系，不表示固定日期</text>

              <path id="edge-japan-conclusion" data-graph-role="edge" data-edge-id="japan-conclusion" data-source="premise-japan" data-target="conditional-conclusion" data-edge-kind="flow" data-flow="primary" data-bends="0" d="M 350 139 H 450" fill="none" stroke="#2b6f88" stroke-width="2" marker-end="url(#arrow-blue)"/>
              <path id="edge-china-conclusion" data-graph-role="edge" data-edge-id="china-conclusion" data-source="premise-china" data-target="conditional-conclusion" data-edge-kind="flow" data-flow="primary" data-bends="0" d="M 910 139 H 810" fill="none" stroke="#2b6f88" stroke-width="2" marker-end="url(#arrow-blue)"/>
              <path id="edge-conclusion-phase1" data-graph-role="edge" data-edge-id="conclusion-phase1" data-source="conditional-conclusion" data-target="phase-1" data-edge-kind="flow" data-flow="primary" data-bends="2" d="M 520 194 V 235 H 220 V 277" fill="none" stroke="#2b6f88" stroke-width="2" marker-end="url(#arrow-blue)"/>
              <path id="edge-conclusion-phase2" data-graph-role="edge" data-edge-id="conclusion-phase2" data-source="conditional-conclusion" data-target="phase-2" data-edge-kind="flow" data-flow="primary" data-bends="0" d="M 630 194 V 277" fill="none" stroke="#2b6f88" stroke-width="2" marker-end="url(#arrow-blue)"/>
              <path id="edge-conclusion-phase3" data-graph-role="edge" data-edge-id="conclusion-phase3" data-source="conditional-conclusion" data-target="phase-3" data-edge-kind="flow" data-flow="primary" data-bends="2" d="M 740 194 V 235 H 1040 V 277" fill="none" stroke="#2b6f88" stroke-width="2" marker-end="url(#arrow-blue)"/>
              <path id="edge-phase1-phase2" data-graph-role="edge" data-edge-id="phase1-phase2" data-source="phase-1" data-target="phase-2" data-edge-kind="phase-transition" data-flow="primary" data-bends="0" d="M 380 357 H 460" fill="none" stroke="#a34e23" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
              <path id="edge-phase2-phase3" data-graph-role="edge" data-edge-id="phase2-phase3" data-source="phase-2" data-target="phase-3" data-edge-kind="phase-transition" data-flow="primary" data-bends="0" d="M 800 357 H 880" fill="none" stroke="#a34e23" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
              <path id="edge-rail-feedback" data-graph-role="edge" data-edge-id="rail-feedback" data-source="condition-feedback" data-target="conditional-conclusion" data-edge-kind="feedback" data-flow="feedback" data-bends="3" d="M 1190 576 H 1332 V 74 H 780 V 103" fill="none" stroke="#7653a6" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-purple)"/>
              <text class="edge-label" x="1085" y="68" fill="#7653a6">结果改变条件 → 重新判断力量与阶段</text>

              <text class="lane" x="40" y="88">1 · 前提：不是只看强弱，而是看全部条件及其变化</text>
              <g id="premise-japan" data-node-id="premise-japan" data-graph-role="node" data-semantic-role="premise" data-graph-bounds="40,103,350,194">
                <rect x="40" y="103" width="310" height="91" rx="9" fill="#eaf4f7" stroke="#b8d9e2" stroke-width="1.5"/>
                <text class="node-title" x="60" y="130">日本：强，但受约束</text>
                <text class="node-sub" x="60" y="153">军力、经济、组织较强</text>
                <text class="node-sub" x="60" y="172">同时有人力物力限度、侵略性质与国际压力</text>
              </g>
              <g id="conditional-conclusion" data-node-id="conditional-conclusion" data-graph-role="node" data-semantic-role="conclusion" data-graph-bounds="450,103,810,194">
                <rect x="450" y="103" width="360" height="91" rx="9" fill="#f7eee7" stroke="#e6c4ad" stroke-width="1.5"/>
                <text class="node-title" x="630" y="130" text-anchor="middle">条件结论：不能速胜，也不必亡国</text>
                <text class="node-sub" x="630" y="153" text-anchor="middle">敌强我弱 → 战争不能快速结束</text>
                <text class="node-sub" x="630" y="172" text-anchor="middle">条件可被行动改变 → 胜负不是静态强弱的直线外推</text>
              </g>
              <g id="premise-china" data-node-id="premise-china" data-graph-role="node" data-semantic-role="premise" data-graph-bounds="910,103,1320,194">
                <rect x="910" y="103" width="410" height="91" rx="9" fill="#edf6ef" stroke="#bdd9c3" stroke-width="1.5"/>
                <text class="node-title" x="930" y="130">中国：弱，但有纵深与增长条件</text>
                <text class="node-sub" x="930" y="153">军力、经济、组织较弱；有大国纵深、正义性与动员潜力</text>
                <text class="node-sub" x="930" y="172">胜利仍取决于国内联合、国际援助等条件能否形成</text>
              </g>

              <text class="lane" x="40" y="258">2 · 三个战略阶段：轮廓用于指导，现实会曲折、重叠并校正它</text>
              <g id="phase-1" data-node-id="phase-1" data-graph-role="node" data-semantic-role="phase" data-graph-bounds="40,277,380,438">
                <rect x="40" y="277" width="340" height="161" rx="10" fill="#f5ebe6" stroke="#e2bba8" stroke-width="1.5"/>
                <text class="phase-num" x="62" y="306" fill="#934624">阶段一</text>
                <text class="phase-title" x="62" y="335">战略防御</text>
                <text class="phase-sub" x="62" y="361">敌：战略进攻　我：战略防御</text>
                <text class="phase-sub" x="62" y="388">主要形式：运动战</text>
                <text class="phase-sub" x="62" y="411">目标：保存力量、消耗敌人、争取时间</text>
              </g>
              <g id="phase-2" data-node-id="phase-2" data-graph-role="node" data-semantic-role="phase" data-graph-bounds="460,277,800,438">
                <rect x="460" y="277" width="340" height="161" rx="10" fill="#fff4df" stroke="#ead09a" stroke-width="1.5"/>
                <text class="phase-num" x="482" y="306" fill="#8b5b08">阶段二 · 枢纽</text>
                <text class="phase-title" x="482" y="335">战略相持</text>
                <text class="phase-sub" x="482" y="361">敌：保守占领　我：准备反攻</text>
                <text class="phase-sub" x="482" y="388">主要形式：游击战，运动战辅助</text>
                <text class="phase-sub" x="482" y="411">目标：动员、建设、消耗并改变力量对比</text>
              </g>
              <g id="phase-3" data-node-id="phase-3" data-graph-role="node" data-semantic-role="phase" data-graph-bounds="880,277,1220,438">
                <rect x="880" y="277" width="340" height="161" rx="10" fill="#e9f4ef" stroke="#b8d9c9" stroke-width="1.5"/>
                <text class="phase-num" x="902" y="306" fill="#176652">阶段三</text>
                <text class="phase-title" x="902" y="335">战略反攻</text>
                <text class="phase-sub" x="902" y="361">我：战略反攻　敌：战略退却</text>
                <text class="phase-sub" x="902" y="388">主要形式：运动战；阵地战地位上升</text>
                <text class="phase-sub" x="902" y="411">条件：自身增长 + 国际力量 + 敌内变化</text>
              </g>
              <text class="edge-label" x="420" y="347" text-anchor="middle" fill="#8d3f1d">进攻受限</text>
              <text class="edge-label" x="840" y="347" text-anchor="middle" fill="#8d3f1d">力量转变</text>

              <text class="lane" x="40" y="478">3 · 跨阶段执行：目的不是“熬时间”，而是主动改变胜负条件</text>
              <g id="scale-contrast" data-node-id="scale-contrast" data-graph-role="node" data-semantic-role="method" data-graph-bounds="40,496,315,590">
                <rect x="40" y="496" width="275" height="94" rx="9" fill="#eef5f8" stroke="#bdd7e0" stroke-width="1.5"/>
                <text class="node-title" x="58" y="524">尺度转换</text>
                <text class="node-sub" x="58" y="548">战略：防御 · 持久 · 内线</text>
                <text class="node-sub" x="58" y="568">战役战斗：进攻 · 速决 · 外线</text>
              </g>
              <g id="active-flex-plan" data-node-id="active-flex-plan" data-graph-role="node" data-semantic-role="method" data-graph-bounds="335,496,610,590">
                <rect x="335" y="496" width="275" height="94" rx="9" fill="#eef5f8" stroke="#bdd7e0" stroke-width="1.5"/>
                <text class="node-title" x="353" y="524">主动 · 灵活 · 计划</text>
                <text class="node-sub" x="353" y="548">在局部取得优势与主动</text>
                <text class="node-sub" x="353" y="568">计划随范围、阶段与新情况调整</text>
              </g>
              <g id="mobilization" data-node-id="mobilization" data-graph-role="node" data-semantic-role="foundation" data-graph-bounds="630,496,905,590">
                <rect x="630" y="496" width="275" height="94" rx="9" fill="#edf6ef" stroke="#bdd9c3" stroke-width="1.5"/>
                <text class="node-title" x="648" y="524">政治动员与军民关系</text>
                <text class="node-sub" x="648" y="548">说明目的、步骤与政策，并持续联系生活</text>
                <text class="node-sub" x="648" y="568">作者强调尊重士兵、人民和俘虏人格</text>
              </g>
              <g id="condition-feedback" data-node-id="condition-feedback" data-graph-role="node" data-semantic-role="feedback" data-graph-bounds="925,496,1190,590">
                <rect x="925" y="496" width="265" height="94" rx="9" fill="#f3eef8" stroke="#d5c5e6" stroke-width="1.5"/>
                <text class="node-title" x="943" y="524">条件反馈</text>
                <text class="node-sub" x="943" y="548">经验、组织、军力、国际援助变化</text>
                <text class="node-sub" x="943" y="568">重新判断强弱、主动与所处阶段</text>
              </g>

              <text class="lane" x="40" y="628">4 · 三道审计门：防止把战略模型读成事后神话或万能公式</text>
              <g id="audit-calendar" data-node-id="audit-calendar" data-graph-role="node" data-semantic-role="audit" data-graph-bounds="40,646,420,724">
                <rect x="40" y="646" width="380" height="78" rx="9" fill="#fff1f1" stroke="#efc5c5" stroke-width="1.5"/>
                <text class="audit-title" x="58" y="674">阶段不是日历</text>
                <text class="audit-sub" x="58" y="698">原文明确说具体情况不能预断，轮廓要由事实校正。</text>
              </g>
              <g id="audit-causality" data-node-id="audit-causality" data-graph-role="node" data-semantic-role="audit" data-graph-bounds="440,646,840,724">
                <rect x="440" y="646" width="400" height="78" rx="9" fill="#fff1f1" stroke="#efc5c5" stroke-width="1.5"/>
                <text class="audit-title" x="458" y="674">结果不等于全部因果获证</text>
                <text class="audit-sub" x="458" y="698">1945 年结局来自中国抗战及更广泛同盟国战争等共同作用。</text>
              </g>
              <g id="audit-transfer" data-node-id="audit-transfer" data-graph-role="node" data-semantic-role="audit" data-graph-bounds="860,646,1320,724">
                <rect x="860" y="646" width="460" height="78" rx="9" fill="#fff1f1" stroke="#efc5c5" stroke-width="1.5"/>
                <text class="audit-title" x="878" y="674">离开战争语境必须重新论证</text>
                <text class="audit-sub" x="878" y="698">“敌我、消耗、动员”等概念不能直接搬到组织、商业或日常关系。</text>
              </g>
            </svg>
