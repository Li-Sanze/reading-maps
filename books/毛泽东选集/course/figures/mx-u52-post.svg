<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 820" width="100%" height="auto" role="img" aria-labelledby="gr-method-title gr-method-desc" data-quality-profile="standard">
          <title id="gr-method-title">两类矛盾的分类、处理方法与风险门</title>
          <desc id="gr-method-desc">顶部先问谁被归入人民或敌人。左路敌我矛盾导向专政和强制，右路人民内部矛盾导向讨论、批评、说服教育，同时保留维持秩序的行政命令。底部三道风险门是分类权、类别移动、纠错与边界复核。</desc>
          <style>text{font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif}.t{font-size:21px;font-weight:780;fill:#17211d}.s{font-size:12px;fill:#68716c}.k{font-size:12px;font-weight:850;letter-spacing:.08em}.ct{font-size:18px;font-weight:820;fill:#17211d}.v{font-size:13px;fill:#33413a}.n{font-size:11px;fill:#66716b}.edge{font-size:11px;font-weight:760}</style>
          <defs><marker id="gr-arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#9b4a3c"/></marker><marker id="gr-arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#256b87"/></marker><marker id="gr-arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6745a5"/></marker></defs>
          <rect width="1360" height="820" rx="20" fill="#fffdf8"/><text class="t" x="40" y="40">分类不是前置小步骤：它决定后续可使用什么方法</text><text class="s" x="40" y="64">复原作者主张，同时把文本内部承认的移动、误判和行政边界显式画出</text>
          <g id="method-classify" data-graph-role="node" data-semantic-role="classification" data-graph-bounds="400,95,960,190"><rect x="400" y="95" width="560" height="95" rx="18" fill="#304b63"/><text class="k" x="430" y="126" fill="#cfe4f1">先做政治分类</text><text x="430" y="157" font-size="18" font-weight="820" fill="#fff">谁属于“人民”？谁被认定为“敌人”？</text><text x="430" y="178" font-size="11" fill="#d8e7ef">范围随国家、历史时期与政治态度而变化</text></g>

          <path id="method-edge-enemy" data-graph-role="edge" data-source="method-classify" data-target="method-enemy" d="M560 190V225H315V255" fill="none" stroke="#9b4a3c" stroke-width="2.2" marker-end="url(#gr-arrow-red)"/><text class="edge" x="398" y="216" fill="#8a2f2f">被归为敌我矛盾</text>
          <path id="method-edge-people" data-graph-role="edge" data-source="method-classify" data-target="method-people" d="M800 190V225H1045V255" fill="none" stroke="#256b87" stroke-width="2.2" marker-end="url(#gr-arrow-blue)"/><text class="edge" x="842" y="216" fill="#225f8b">被归为人民内部矛盾</text>

          <g id="method-enemy" data-graph-role="container" data-semantic-role="author-method" data-graph-bounds="80,255,550,510"><rect x="80" y="255" width="470" height="255" rx="18" fill="#fff0ed" stroke="#e0b6ae"/><text class="k" x="108" y="291" fill="#8a2f2f">敌我之间的矛盾</text><text class="ct" x="108" y="327">专政方法与法律强制</text><text class="v" x="108" y="365">· 限制政治活动和言论空间</text><text class="v" x="108" y="394">· 强制服从法律并改造</text><text class="v" x="108" y="423">· 肃反被归入这条路径</text><rect x="108" y="451" width="414" height="38" rx="9" fill="#fff" stroke="#e5c3bd"/><text class="n" x="126" y="475">因此，错误归类的后果不是措辞差异，而是处理方式改变。</text></g>

          <g id="method-people" data-graph-role="container" data-semantic-role="author-method" data-graph-bounds="810,255,1280,510"><rect x="810" y="255" width="470" height="255" rx="18" fill="#eef6fb" stroke="#b8d6e5"/><text class="k" x="838" y="291" fill="#225f8b">人民内部的矛盾</text><text class="ct" x="838" y="327">民主讨论、批评与说服教育</text><text class="v" x="838" y="365">· 思想和是非问题不能靠强制解决</text><text class="v" x="838" y="394">· “团结——批评——团结”</text><text class="v" x="838" y="423">· 错误意见应通过争论而非简单禁止</text><rect x="838" y="451" width="414" height="38" rx="9" fill="#fff" stroke="#c8dee8"/><text class="n" x="856" y="475">同时保留“有领导的自由”和维持秩序的行政命令。</text></g>

          <path id="method-transform" data-graph-role="edge" data-semantic-role="category-movement" data-source="method-people" data-target="method-enemy" d="M810 535H550" fill="none" stroke="#6745a5" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#gr-arrow-purple)"/><text class="edge" x="585" y="524" fill="#6745a5">文本承认：处理不当或政治态度变化时，类别可能转化</text>

          <g id="risk-classifier" data-graph-role="node" data-semantic-role="risk-gate" data-graph-bounds="80,610,450,745"><rect x="80" y="610" width="370" height="135" rx="16" fill="#fff5ef" stroke="#e4bda4"/><text class="k" x="105" y="642" fill="#8b4a1b">风险门 01 · 分类权</text><text class="ct" x="105" y="675">谁来定义与举证？</text><text class="n" x="105" y="704">“人民／敌人”不是自然标签；定义者、标准</text><text class="n" x="105" y="723">公开程度与当事人申辩空间都影响结果。</text></g>
          <g id="risk-boundary" data-graph-role="node" data-semantic-role="risk-gate" data-graph-bounds="495,610,865,745"><rect x="495" y="610" width="370" height="135" rx="16" fill="#f3effa" stroke="#d3c5ea"/><text class="k" x="520" y="642" fill="#6745a5">风险门 02 · 行政边界</text><text class="ct" x="520" y="675">秩序还是思想强制？</text><text class="n" x="520" y="704">文章保留行政命令；必须继续检查它是否</text><text class="n" x="520" y="723">实质压制了本应以讨论处理的思想问题。</text></g>
          <g id="risk-correction" data-graph-role="node" data-semantic-role="risk-gate" data-graph-bounds="910,610,1280,745"><rect x="910" y="610" width="370" height="135" rx="16" fill="#fceeee" stroke="#ddb3b3"/><text class="k" x="935" y="642" fill="#8a2f2f">风险门 03 · 纠错机制</text><text class="ct" x="935" y="675">误判怎样被发现和纠正？</text><text class="n" x="935" y="704">作者警告“左”倾扩大化；但原则警告不等于</text><text class="n" x="935" y="723">已经具备独立复核、公开申诉与有效制约。</text></g>
          <text class="s" x="80" y="790">语义边界：这是政治分类与治理方法图，不是无价值立场的统计分类器；底部三问是批判审计，不冒充作者的制度设计。</text>
        </svg>
