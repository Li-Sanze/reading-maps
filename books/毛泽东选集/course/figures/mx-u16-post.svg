<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 650" width="100%" height="auto" role="img" aria-labelledby="title desc" data-quality-profile="standard">
              <title id="title">《实践论》与《矛盾论》的综合问题解决模型</title>
              <desc id="desc">从社会实践取得材料，由感性认识上升到理性认识，再用矛盾的特殊性、主要矛盾、主要方面和条件分析形成行动方案；行动结果返回下一轮认识。下方三个审计问题提醒材料、因果和主次判断都需要复核。</desc>
              <style>
                text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
                .title { font-size: 18px; font-weight: 700; fill: #111827; }
                .subtitle { font-size: 12px; fill: #6b7280; }
                .lane { font-size: 13px; font-weight: 700; fill: #374151; }
                .node-title { font-size: 15px; font-weight: 700; fill: #111827; }
                .node-sub { font-size: 11px; fill: #4b5563; }
                .edge-label { font-size: 11px; font-weight: 700; }
                .audit-title { font-size: 13px; font-weight: 700; fill: #7f1d1d; }
                .audit-sub { font-size: 11px; fill: #4b5563; }
                .legend { font-size: 11px; fill: #6b7280; }
              </style>
              <defs>
                <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
                <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
                <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker>
              </defs>
            
              <rect width="1280" height="650" rx="18" fill="#fffdf8"/>
              <text class="title" x="40" y="31">两篇合起来：认识怎样形成，行动重点怎样选择</text>
              <text class="subtitle" x="40" y="53">报告综合模型 · 不是作者在单一段落中给出的流程图</text>
            
              <path id="edge-result-practice" data-graph-role="edge" data-edge-id="result-practice" data-source="result" data-target="practice" data-edge-kind="feedback" data-flow="feedback" data-bends="2" d="M 1200 120 V 88 H 115 V 120" fill="none" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)"/>
              <text class="edge-label" x="657" y="79" text-anchor="middle" fill="#7e22ce">结果、意外与新条件 → 修正理论并重划主次</text>
            
              <text class="lane" x="40" y="105">《实践论》：认识循环</text>
              <path id="edge-practice-sensory" data-graph-role="edge" data-edge-id="practice-sensory" data-source="practice" data-target="sensory" data-edge-kind="flow" data-flow="primary" data-bends="0" d="M 190 165 H 230" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
              <path id="edge-sensory-rational" data-graph-role="edge" data-edge-id="sensory-rational" data-source="sensory" data-target="rational" data-edge-kind="flow" data-flow="primary" data-bends="0" d="M 380 165 H 420" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
              <path id="edge-action-result" data-graph-role="edge" data-edge-id="action-result" data-source="action" data-target="result" data-edge-kind="flow" data-flow="primary" data-bends="0" d="M 1120 165 H 1160" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
            
              <rect id="practice" data-node-id="practice" data-graph-role="node" data-semantic-role="process" data-graph-bounds="40,120,190,210" x="40" y="120" width="150" height="90" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
              <text class="node-title" x="115" y="151" text-anchor="middle">实践与材料</text>
              <text class="node-sub" x="115" y="175" text-anchor="middle">生产 · 政治 · 科学 · 艺术</text>
              <text class="node-sub" x="115" y="193" text-anchor="middle">直接经验 + 间接经验</text>
            
              <rect id="sensory" data-node-id="sensory" data-graph-role="node" data-semantic-role="process" data-graph-bounds="230,120,380,210" x="230" y="120" width="150" height="90" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
              <text class="node-title" x="305" y="151" text-anchor="middle">感性认识</text>
              <text class="node-sub" x="305" y="175" text-anchor="middle">现象 · 片面</text>
              <text class="node-sub" x="305" y="193" text-anchor="middle">外部联系</text>
            
              <rect id="rational" data-node-id="rational" data-graph-role="node" data-semantic-role="process" data-graph-bounds="420,120,570,210" x="420" y="120" width="150" height="90" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
              <text class="node-title" x="495" y="151" text-anchor="middle">理性认识</text>
              <text class="node-sub" x="495" y="175" text-anchor="middle">概念 · 判断 · 推理</text>
              <text class="node-sub" x="495" y="193" text-anchor="middle">寻找本质与内部联系</text>
            
              <rect id="action" data-node-id="action" data-graph-role="node" data-semantic-role="process" data-graph-bounds="980,120,1120,210" x="980" y="120" width="140" height="90" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
              <text class="node-title" x="1050" y="151" text-anchor="middle">行动方案</text>
              <text class="node-sub" x="1050" y="175" text-anchor="middle">把理论送回实践</text>
              <text class="node-sub" x="1050" y="193" text-anchor="middle">同时预设修正条件</text>
            
              <rect id="result" data-node-id="result" data-graph-role="node" data-semantic-role="result" data-graph-bounds="1160,120,1240,210" x="1160" y="120" width="80" height="90" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
              <text class="node-title" x="1200" y="151" text-anchor="middle">结果</text>
              <text class="node-sub" x="1200" y="175" text-anchor="middle">符合</text>
              <text class="node-sub" x="1200" y="193" text-anchor="middle">失败 / 意外</text>
            
              <text class="lane" x="40" y="273">《矛盾论》：把理性认识变成具体分析</text>
              <path id="edge-rational-boundary" data-graph-role="edge" data-edge-id="rational-boundary" data-source="rational" data-target="boundary" data-edge-kind="transform" data-flow="analysis" data-bends="0" d="M 495 210 V 300" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
              <path id="edge-boundary-multiple" data-graph-role="edge" data-edge-id="boundary-multiple" data-source="boundary" data-target="multiple" data-edge-kind="flow" data-flow="analysis" data-bends="0" d="M 570 345 H 600" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
              <path id="edge-multiple-principal" data-graph-role="edge" data-edge-id="multiple-principal" data-source="multiple" data-target="principal" data-edge-kind="flow" data-flow="analysis" data-bends="0" d="M 750 345 H 780" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
              <path id="edge-principal-aspect" data-graph-role="edge" data-edge-id="principal-aspect" data-source="principal" data-target="aspect" data-edge-kind="flow" data-flow="analysis" data-bends="0" d="M 930 345 H 960" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
              <path id="edge-aspect-action" data-graph-role="edge" data-edge-id="aspect-action" data-source="aspect" data-target="action" data-edge-kind="transform" data-flow="analysis" data-bends="0" d="M 1050 300 V 210" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
            
              <rect id="boundary" data-node-id="boundary" data-graph-role="node" data-semantic-role="analysis" data-graph-bounds="420,300,570,390" x="420" y="300" width="150" height="90" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
              <text class="node-title" x="495" y="331" text-anchor="middle">对象与阶段</text>
              <text class="node-sub" x="495" y="355" text-anchor="middle">先定边界、时间与条件</text>
              <text class="node-sub" x="495" y="373" text-anchor="middle">拒绝抽象套公式</text>
            
              <rect id="multiple" data-node-id="multiple" data-graph-role="node" data-semantic-role="analysis" data-graph-bounds="600,300,750,390" x="600" y="300" width="150" height="90" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
              <text class="node-title" x="675" y="331" text-anchor="middle">多重矛盾</text>
              <text class="node-sub" x="675" y="355" text-anchor="middle">列出关系、张力与变化</text>
              <text class="node-sub" x="675" y="373" text-anchor="middle">不强迫所有问题成一对</text>
            
              <rect id="principal" data-node-id="principal" data-graph-role="node" data-semantic-role="analysis" data-graph-bounds="780,300,930,390" x="780" y="300" width="150" height="90" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
              <text class="node-title" x="855" y="331" text-anchor="middle">主要矛盾</text>
              <text class="node-sub" x="855" y="355" text-anchor="middle">当前最能牵动其他问题</text>
              <text class="node-sub" x="855" y="373" text-anchor="middle">必须保留替代解释</text>
            
              <rect id="aspect" data-node-id="aspect" data-graph-role="node" data-semantic-role="analysis" data-graph-bounds="960,300,1140,390" x="960" y="300" width="180" height="90" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
              <text class="node-title" x="1050" y="331" text-anchor="middle">主要方面与条件</text>
              <text class="node-sub" x="1050" y="355" text-anchor="middle">谁暂居支配地位？何时转化？</text>
              <text class="node-sub" x="1050" y="373" text-anchor="middle">对抗只是可能形式之一</text>
            
              <rect data-graph-role="decoration" data-owner="audit-material" x="40" y="440" width="370" height="96" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
              <text class="audit-title" x="60" y="471">审计 1 · 材料不是“纯观察”</text>
              <text class="audit-sub" x="60" y="496">记录方式、已有概念和立场会影响看见什么。</text>
              <text class="audit-sub" x="60" y="516">把“观察 / 推断 / 价值判断”分栏。</text>
            
              <rect data-graph-role="decoration" data-owner="audit-cause" x="455" y="440" width="370" height="96" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
              <text class="audit-title" x="475" y="471">审计 2 · 成功不自动等于真理</text>
              <text class="audit-sub" x="475" y="496">同一结果可能来自多个原因，短期有效也可能长期失效。</text>
              <text class="audit-sub" x="475" y="516">事先写下预测、反证条件与时间尺度。</text>
            
              <rect data-graph-role="decoration" data-owner="audit-principal" x="870" y="440" width="370" height="96" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
              <text class="audit-title" x="890" y="471">审计 3 · “主要”是待证假说</text>
              <text class="audit-sub" x="890" y="496">谁划边界、依据什么、遗漏谁，会改变主次判断。</text>
              <text class="audit-sub" x="890" y="516">至少保留一个竞争模型并比较解释力。</text>
            
              <g transform="translate(40 590)">
                <line x1="0" y1="8" x2="34" y2="8" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/><text class="legend" x="43" y="12">认识形成与行动</text>
                <line x1="175" y1="8" x2="209" y2="8" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/><text class="legend" x="218" y="12">具体矛盾分析</text>
                <line x1="350" y1="8" x2="384" y2="8" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)"/><text class="legend" x="393" y="12">反馈与修正</text>
                <text class="legend" x="1200" y="12" text-anchor="end">外部审计问题由报告补入，不是原文术语</text>
              </g>
            </svg>
